[server]
headless = true
# Local development only. Cloud ingress needs separate authenticated review.
address = "127.0.0.1"
port = 5000
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#0e4d92"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
